spring.application.name=ecommerce-management-system
server.port=8080

# ---------- PostgreSQL (override with environment variables) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ---------- JWT ----------
# Secret must be at least 32 characters. ALWAYS override JWT_SECRET in real deployments.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789-abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Seeded admin account (created on first start) ----------
app.admin.name=Store Admin
app.admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---------- Swagger UI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
